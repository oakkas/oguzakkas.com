<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=block" rel="stylesheet">
<style>
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Inter, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 85% 15%, rgba(56,189,248,.22), transparent 45%), linear-gradient(135deg, #0f172a 0%, #111c33 60%, #0b1324 100%); color: #e2e8f0; }
  .wrap { display: flex; height: 100%; padding: 64px 72px; box-sizing: border-box; gap: 48px; align-items: center; }
  .left { flex: 1.15; }
  .who { display: flex; align-items: center; gap: 24px; }
  .who img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 4px solid rgba(56,189,248,.5); }
  h1 { font-size: 64px; line-height: 1.02; margin: 0; color: #fff; font-weight: 800; letter-spacing: -0.02em; }
  .title { margin-top: 26px; font-size: 32px; font-weight: 600; color: #38bdf8; }
  .tag { margin-top: 16px; font-size: 24px; line-height: 1.45; color: #94a3b8; }
  .url { margin-top: 30px; font-size: 22px; font-weight: 600; color: #cbd5e1; }
  .card { flex: 1; background: rgba(30,41,59,.85); border: 1px solid #334155; border-radius: 22px; padding: 26px 28px; box-shadow: 0 30px 60px rgba(0,0,0,.35); }
  .label { font-size: 15px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #38bdf8; }
  .card h2 { font-size: 26px; margin: 8px 0 18px; color: #fff; }
  .row { display: flex; justify-content: space-between; font-size: 19px; padding: 9px 0; border-bottom: 1px solid #334155; color: #e2e8f0; }
  .row span:last-child { color: #34d399; font-weight: 700; }
  .badge { margin-top: 18px; display: inline-block; background: rgba(52,211,153,.15); color: #34d399; font-weight: 700; font-size: 18px; padding: 8px 16px; border-radius: 999px; }
</style></head><body>
  <div class="wrap">
    <div class="left">
      <div class="who"><img src="../public/assets/oguz.webp" alt=""><h1>Oguz<br>Akkas</h1></div>
      <div class="title">ML &amp; Data Engineer</div>
      <div class="tag">LLM pipelines, NLP, and data platforms that run in production.</div>
      <div class="url">oguzakkas.com</div>
    </div>
    <div class="card">
      <div class="label">Live demo</div>
      <h2>Clinical documents → structured data</h2>
      <div class="row"><span>Glucose · 112 mg/dL · H</span><span>✓</span></div>
      <div class="row"><span>LDL Cholesterol · 138 mg/dL · H</span><span>✓</span></div>
      <div class="row"><span>Ceftriaxone · 1 g IV daily</span><span>✓</span></div>
      <div class="row" style="border-bottom: 0"><span>Adverse event · rash</span><span>✓</span></div>
      <div class="badge">Scored against an answer key</div>
    </div>
  </div>
</body></html>
