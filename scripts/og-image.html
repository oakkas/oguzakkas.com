<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* The site's own Inter file, so the render needs no network */
  @font-face { font-family: 'Inter Variable'; font-weight: 100 900; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2-variations'); }
  body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter Variable', Helvetica, Arial, sans-serif; color: #0f172a;
    background: linear-gradient(135deg, #ffffff 0%, #f8fafc 50%, #e0f2fe 100%); }
  .wrap { position: relative; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
  .top { flex: 1; display: flex; flex-direction: column; padding: 56px 64px 0; }
  .who { display: flex; align-items: center; gap: 18px; }
  .who img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 0 0 1px #e2e8f0; }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .title { margin-top: 2px; font-size: 20px; font-weight: 600; color: #0369a1; }
  h1 { position: relative; z-index: 1; margin: auto 0; padding-bottom: 8px; font-size: 66px; font-weight: 500; line-height: 1.06; letter-spacing: -0.035em; }
  .grad { background: linear-gradient(90deg, #0284c7, #10b981); -webkit-background-clip: text; background-clip: text; color: transparent; }
  canvas { position: absolute; right: 8px; top: 104px; width: 500px; height: 400px; }
  .stats { display: flex; align-items: center; gap: 44px; padding: 26px 64px; border-top: 1px solid #e2e8f0; background: rgba(255,255,255,.7); }
  .stat b { display: block; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .stat span { font-size: 17px; color: #475569; }
  .url { margin-left: auto; font-size: 24px; font-weight: 700; color: #0369a1; }
</style></head><body>
  <div class="wrap">
    <div class="top">
      <div class="who">
        <img src="../public/assets/oguz.webp" alt="">
        <div><div class="name">Oguz Akkas</div><div class="title">ML &amp; Data Engineer</div></div>
      </div>
      <h1>I turn messy data into<br><span class="grad">ML and LLM systems</span><br>that run in production.</h1>
    </div>
    <div class="stats">
      <div class="stat"><b>Since 2012</b><span>building ML systems</span></div>
      <div class="stat"><b>5</b><span>peer-reviewed papers</span></div>
      <div class="stat"><b>LLMs</b><span>in production in healthcare</span></div>
      <div class="url">oguzakkas.com</div>
    </div>
    <canvas id="net"></canvas>
  </div>
<script>
// One still frame of the homepage's network (components/NeuralScene.tsx, light theme),
// with a few pulses of data caught mid-flight
const LAYERS = [['Ingest', 7], ['Extract', 10], ['Train', 12], ['Deploy', 10], ['Monitor', 6]];
const layerX = l => (l - 2) * 0.85;
let seed = 7;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

const nodes = [], start = [], edges = [];
LAYERS.forEach(([, count], l) => {
  start.push(nodes.length);
  const radius = 0.3 + Math.sqrt(count) * 0.2;
  for (let i = 0; i < count; i++) {
    const r = radius * Math.sqrt((i + 0.5) / count), a = i * 2.399963;
    nodes.push({ x: layerX(l), y: r * Math.sin(a), z: r * Math.cos(a), layer: l });
  }
});
for (let l = 0; l < LAYERS.length - 1; l++) {
  for (let i = 0; i < LAYERS[l][1]; i++) {
    const targets = Array.from({ length: LAYERS[l + 1][1] }, (_, j) => start[l + 1] + j);
    for (let k = 0; k < 3; k++) {
      const pick = k + Math.floor(rand() * (targets.length - k));
      [targets[k], targets[pick]] = [targets[pick], targets[k]];
      edges.push({ from: start[l] + i, to: targets[k] });
    }
  }
}

const draw = () => {
  const canvas = document.getElementById('net');
  const W = canvas.clientWidth, H = canvas.clientHeight, dpr = 2;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const ay = 0.24, ax = 0.34, cy = Math.cos(ay), sy = Math.sin(ay), cx = Math.cos(ax), sx = Math.sin(ax);
  const unit = Math.min(W / 5, H / 3.1);
  const p = nodes.map(n => {
    const x1 = n.x * cy + n.z * sy, z1 = -n.x * sy + n.z * cy;
    const y1 = n.y * cx - z1 * sx, z2 = n.y * sx + z1 * cx;
    const s = 3.6 / (3.6 + z2);
    return { x: W / 2 + x1 * unit * s, y: H / 2 + y1 * unit * s, s, d: Math.min(1, Math.max(0, (z2 + 1.2) / 2.4)) };
  });
  const glow = (x, y, size, rgb, alpha) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, size / 2);
    g.addColorStop(0, `rgba(${rgb}, ${alpha})`); g.addColorStop(0.25, `rgba(${rgb}, ${alpha * 0.55})`); g.addColorStop(1, `rgba(${rgb}, 0)`);
    ctx.fillStyle = g; ctx.fillRect(x - size / 2, y - size / 2, size, size);
  };

  ctx.lineWidth = 1;
  for (const e of edges) {
    const a = p[e.from], b = p[e.to];
    ctx.strokeStyle = `rgba(71, 85, 105, ${(0.14 + 0.3 * (1 - (a.d + b.d) / 2)).toFixed(3)})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // Pulses: every fifth edge, at a spread of positions along it
  edges.forEach((e, i) => {
    if (i % 5) return;
    const a = p[e.from], b = p[e.to], t = ((i * 37) % 100) / 100;
    glow(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 18 * (a.s + (b.s - a.s) * t), '16, 185, 129', 0.95);
  });
  const lit = new Set([3, 12, 20, 30, 38, 41]);
  [...p.keys()].sort((i, j) => p[j].d - p[i].d).forEach(i => {
    const q = p[i];
    if (lit.has(i)) glow(q.x, q.y, 34 * q.s, '2, 132, 199', 0.7);
    ctx.fillStyle = `rgba(2, 132, 199, ${(0.45 + 0.55 * (1 - q.d)).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, (lit.has(i) ? 4 : 3) * q.s, 0, Math.PI * 2); ctx.fill();
  });
  ctx.textAlign = 'center';
  ctx.font = "600 13px 'Inter Variable', sans-serif";
  LAYERS.forEach(([label, count], l) => {
    const m = p.slice(start[l], start[l] + count);
    ctx.fillStyle = 'rgb(71, 85, 105)';
    ctx.globalAlpha = 0.85;
    ctx.fillText(label.toUpperCase(), m.reduce((s, q) => s + q.x, 0) / count, Math.max(...m.map(q => q.y)) + 20);
  });
};
document.fonts.load("600 13px 'Inter Variable'").then(draw);
</script>
</body></html>
